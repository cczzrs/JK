[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jkcuda"
version = "0.1.0"
description = "JK V6.1 explicit FIFO runtime and CUDA backend"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
cuda = ["torch>=2.4"]

[project.scripts]
jkcuda = "jkcuda.cli:main"

[tool.setuptools.packages.find]
include = ["jkcuda*"]

[tool.setuptools.package-data]
jkcuda = ["native/*", "web/*.html", "web/*.js", "web/*.css", "web/state.mjs", "web/graph.mjs", "web/factory.mjs"]
